function spawnFlyingTicketToCart(skuId, sourceElement) {
  const sku = SKU_CATALOG[skuId];
  const cartBtn = document.getElementById('header-cart-btn');
  if (!sku || !sourceElement || !cartBtn) {
    updateCartHeaderBadge(true);
    return;
  }

  const vpRect = viewport.getBoundingClientRect();
  const srcRect = sourceElement.getBoundingClientRect();
  const destRect = cartBtn.getBoundingClientRect();

  const startX = srcRect.left - vpRect.left + srcRect.width / 2 - 29;
  const startY = srcRect.top - vpRect.top + srcRect.height / 2 - 18;
  const endX = destRect.left - vpRect.left + destRect.width / 2 - 29;
  const endY = destRect.top - vpRect.top + destRect.height / 2 - 18;

  const flyer = document.createElement('div');
  flyer.className = 'flying-ticket-token';
  flyer.innerHTML = build2DItemThumbSVG(sku, true);
  viewport.appendChild(flyer);

  const motion = { t: 0 };
  const ctrlX = (startX + endX) * 0.5 - 50;
  const ctrlY = Math.min(startY, endY) - 75;

  gsap.set(flyer, { x: startX, y: startY, scale: 0.85, rotation: -12, opacity: 1 });

  gsap.to(motion, {
    t: 1,
    duration: 0.44,
    ease: "power2.inOut",
    onUpdate: () => {
      const p = motion.t;
      const inv = 1 - p;
      const curX = inv * inv * startX + 2 * inv * p * ctrlX + p * p * endX;
      const curY = inv * inv * startY + 2 * inv * p * ctrlY + p * p * endY;
      const sc = p < 0.4 ? 0.85 + p * 0.75 : 1.15 - (p - 0.4) * 1.35;
      const rot = -12 + p * 372;
      gsap.set(flyer, { x: curX, y: curY, scale: Math.max(0.25, sc), rotation: rot });
    },
    onComplete: () => {
      flyer.remove();
      updateCartHeaderBadge(true);
    }
  });
}

function handleAddToCartClick(skuId, btnEl) {
  cartState[skuId] = (cartState[skuId] || 0) + 1;
  spawnFlyingTicketToCart(skuId, btnEl);
  renderDetailPanelContent(false);
  animateCartTotalMoney();
  if (isCartOpen) renderCartItemsList();
}

function changeSkuQtyFromDetail(skuId, delta, btnEl) {
  const currentQty = cartState[skuId] || 0;
  const nextQty = currentQty + delta;

  if (delta > 0) {
    cartState[skuId] = nextQty;
    spawnFlyingTicketToCart(skuId, btnEl);
  } else {
    if (nextQty <= 0) {
      delete cartState[skuId];
    } else {
      cartState[skuId] = nextQty;
    }
    updateCartHeaderBadge(true);
  }

  renderDetailPanelContent(false);
  animateCartTotalMoney();
  if (isCartOpen) renderCartItemsList();
}

function updateCartScrollLock() {
  const listEl = document.getElementById('cart-items-list');
  if (!listEl || listEl.style.display === 'none') return;

  const exceedsVisibleLimit = listEl.scrollHeight > listEl.clientHeight + 2;
  if (exceedsVisibleLimit) {
    listEl.style.overflowY = 'auto';
    listEl.classList.add('scrollable');
  } else {
    listEl.scrollTop = 0;
    listEl.style.overflowY = 'hidden';
    listEl.classList.remove('scrollable');
  }
}

function renderCartItemsList() {
  const emptyEl = document.getElementById('cart-empty-state');
  const listEl = document.getElementById('cart-items-list');
  const entries = Object.entries(cartState).filter(([, q]) => q > 0);

  animateCartTotalMoney();

  if (entries.length === 0) {
    emptyEl.style.display = 'flex';
    listEl.style.display = 'none';
    listEl.innerHTML = '';
    listEl.classList.remove('scrollable');
    listEl.style.overflowY = 'hidden';
    return;
  }

  emptyEl.style.display = 'none';
  listEl.style.display = 'flex';
  listEl.innerHTML = '';

  entries.forEach(([skuId, qty]) => {
    const sku = SKU_CATALOG[skuId];
    if (!sku) return;
    const subtotal = sku.unitPrice * qty;

    const card = document.createElement('div');
    card.className = 'cart-item-card';
    card.id = `cart-card-${skuId}`;
    card.innerHTML = `
      <div class="cart-item-thumb">
        ${build2DItemThumbSVG(sku, false)}
      </div>
      <div class="cart-item-info">
        <div class="cart-item-name">${sku.name}</div>
        <div class="cart-item-meta">${qty}x $${sku.unitPrice} &bull; <strong>$${subtotal}</strong></div>
      </div>
      <div class="cart-item-controls">
        <button type="button" class="cart-ctrl-btn" title="Quitar 1 artículo" onclick="changeSkuQtyFromCart('${skuId}', -1)">&#8722;</button>
        <button type="button" class="cart-ctrl-btn" title="Agregar 1 artículo más" onclick="changeSkuQtyFromCart('${skuId}', 1)">&#43;</button>
        <button type="button" class="cart-ctrl-btn delete-btn" title="Eliminar artículo" onclick="removeSkuFromCartAnimated('${skuId}')">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    `;
    listEl.appendChild(card);
  });

  requestAnimationFrame(updateCartScrollLock);
}

function changeSkuQtyFromCart(skuId, delta) {
  const currentQty = cartState[skuId] || 0;
  const nextQty = currentQty + delta;

  if (nextQty <= 0) {
    removeSkuFromCartAnimated(skuId);
    return;
  }

  cartState[skuId] = nextQty;
  updateCartHeaderBadge(true);
  renderCartItemsList();
  if (currentMode === 'detail' && currentStep === 1) {
    renderDetailPanelContent(false);
  }
}

function removeSkuFromCartAnimated(skuId) {
  const cardEl = document.getElementById(`cart-card-${skuId}`);
  if (!cardEl) {
    delete cartState[skuId];
    updateCartHeaderBadge(false);
    renderCartItemsList();
    if (currentMode === 'detail' && currentStep === 1) renderDetailPanelContent(false);
    return;
  }

  cardEl.style.pointerEvents = 'none';
  const currentHeight = cardEl.offsetHeight;
  cardEl.style.height = currentHeight + 'px';

  const tl = gsap.timeline({
    onComplete: () => {
      delete cartState[skuId];
      updateCartHeaderBadge(false);
      renderCartItemsList();
      if (currentMode === 'detail' && currentStep === 1) {
        renderDetailPanelContent(false);
      }
    }
  });

  tl.to(cardEl, {
    borderColor: '#F87171',
    backgroundColor: 'rgba(220, 38, 38, 0.24)',
    scale: 0.96,
    x: -6,
    duration: 0.1,
    ease: "power2.out"
  })
  .to(cardEl, {
    x: 95,
    rotationZ: 3,
    opacity: 0,
    duration: 0.2,
    ease: "power3.in"
  })
  .to(cardEl, {
    height: 0,
    paddingTop: 0,
    paddingBottom: 0,
    marginTop: 0,
    marginBottom: -10,
    borderWidth: 0,
    duration: 0.16,
    ease: "power2.inOut"
  });
}

function getCartButtonOffsetFromCenter() {
  const cartBtn = document.getElementById('header-cart-btn');
  const vpRect = viewport.getBoundingClientRect();
  if (!cartBtn) return { dx: 0, dy: -200 };

  const btnRect = cartBtn.getBoundingClientRect();
  const btnCenterX = btnRect.left - vpRect.left + btnRect.width / 2;
  const btnCenterY = btnRect.top - vpRect.top + btnRect.height / 2;

  return {
    dx: btnCenterX - vpRect.width / 2,
    dy: btnCenterY - vpRect.height / 2
  };
}

function openCartModal() {
  if (isCartOpen) return;
  isCartOpen = true;

  const backdrop = document.getElementById('cart-backdrop');
  const modal = document.getElementById('cart-modal');
  const cartBtn = document.getElementById('header-cart-btn');

  if (cartBtn) cartBtn.classList.add('active');
  renderCartItemsList();

  backdrop.classList.add('open');
  const { dx, dy } = getCartButtonOffsetFromCenter();

  gsap.killTweensOf([backdrop, modal]);
  gsap.to(backdrop, { opacity: 1, duration: 0.22, ease: "power2.out" });

  gsap.fromTo(
    modal,
    {
      x: dx,
      y: dy,
      scaleX: 0.14,
      scaleY: 0.09,
      opacity: 0.15
    },
    {
      x: 0,
      y: 0,
      scaleX: 1,
      scaleY: 1,
      opacity: 1,
      duration: 0.38,
      ease: "expo.out",
      onComplete: updateCartScrollLock
    }
  );
}

function closeCartModal(instant = false) {
  if (!isCartOpen) return;
  isCartOpen = false;

  const backdrop = document.getElementById('cart-backdrop');
  const modal = document.getElementById('cart-modal');
  const cartBtn = document.getElementById('header-cart-btn');

  if (cartBtn) cartBtn.classList.remove('active');
  backdrop.classList.remove('open');

  gsap.killTweensOf([backdrop, modal]);

  if (instant) {
    gsap.set(backdrop, { opacity: 0 });
    return;
  }

  const { dx, dy } = getCartButtonOffsetFromCenter();

  gsap.to(backdrop, { opacity: 0, duration: 0.22, ease: "power2.inOut" });
  gsap.to(modal, {
    x: dx,
    y: dy,
    scaleX: 0.14,
    scaleY: 0.09,
    opacity: 0,
    duration: 0.26,
    ease: "power3.inOut"
  });
}

function toggleCartModal() {
  if (isCartOpen) {
    closeCartModal(false);
  } else {
    openCartModal();
  }
}

function handleBackdropClick(e) {
  if (e.target.id === 'cart-backdrop') {
    closeCartModal(false);
  }
}

function goToCollectionFromEmptyCart() {
  closeCartModal(false);
  if (currentMode !== 'lineup') {
    setMode('lineup');
  }
}

function sendCartToWhatsApp() {
  const entries = Object.entries(cartState).filter(([, q]) => q > 0);
  if (entries.length === 0) return;

  const lines = ["¡Hola!, ¡Gracias por comprar con nosotros!, te envío mi carrito", ""];
  let grandTotal = 0;

  entries.forEach(([skuId, qty]) => {
    const sku = SKU_CATALOG[skuId];
    if (!sku) return;
    const subtotal = sku.unitPrice * qty;
    grandTotal += subtotal;
    lines.push(`• ${qty}x ${sku.name} ($${sku.unitPrice} c/u) = $${subtotal}`);
  });

  lines.push("");
  lines.push(`Total: $${grandTotal}`);

  const messageText = lines.join("\n");
  const whatsappUrl = `https://wa.me/5218143707239?text=${encodeURIComponent(messageText)}`;
  window.open(whatsappUrl, "_blank", "noopener,noreferrer");
}

/* ============================================================================
   INTERACCIÓN TÁCTIL, SWIPE EN CARRUSEL, SCROLL EN COLECCIÓN Y RAYCASTER 3D
   ============================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let isPointerDown = false;
let touchStartX = 0;
let touchStartY = 0;
let lastTouchY = 0;
let pointerMovedDistance = 0;

container.addEventListener('pointerdown', (e) => {
  isPointerDown = true;
  touchStartX = e.clientX;
  touchStartY = e.clientY;
  lastTouchY = e.clientY;
  pointerMovedDistance = 0;
}, { passive: true });

container.addEventListener('pointermove', (e) => {
  if (!isPointerDown || isCartOpen) return;
  const dy = e.clientY - lastTouchY;
  lastTouchY = e.clientY;
  pointerMovedDistance = Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY);

  // Deslizamiento vertical fluido hacia abajo/arriba en 3. COLECCIÓN
  if (currentMode === 'lineup') {
    const scrollFactor = isCompactView() ? 0.011 : 0.0085;
    collectionTargetScrollY = Math.max(0, Math.min(maxCollectionScrollY, collectionTargetScrollY - dy * scrollFactor));
  }
}, { passive: true });

window.addEventListener('pointerup', () => {
  isPointerDown = false;
}, { passive: true });

// Soporte de rueda de ratón o trackpad en 3. COLECCIÓN
container.addEventListener('wheel', (e) => {
  if (currentMode !== 'lineup' || isCartOpen) return;
  e.preventDefault();
  collectionTargetScrollY = Math.max(0, Math.min(maxCollectionScrollY, collectionTargetScrollY + e.deltaY * 0.0042));
}, { passive: false });

container.addEventListener('pointerup', (e) => {
  if (isCartOpen) return;

  const deltaX = e.clientX - touchStartX;
  const deltaY = e.clientY - touchStartY;

  if (Math.abs(deltaX) > 42 && Math.abs(deltaX) > Math.abs(deltaY) && currentMode === 'carousel') {
    changeItem(deltaX < 0 ? 1 : -1);
    return;
  }

  // Si el usuario estaba deslizando verticalmente la colección, no disparar clic accidental
  if (currentMode === 'lineup' && pointerMovedDistance > 16) return;

  if (currentMode !== 'carousel' && currentMode !== 'lineup') return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const targetsToTest = currentMode === 'lineup' ? allInteractiveModels : getActiveModelList();
  const intersects = raycaster.intersectObjects(targetsToTest, true);

  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && obj.userData.itemIndex === undefined) {
      obj = obj.parent;
    }
    if (obj.userData.itemIndex !== undefined) {
      const clickedIndex = obj.userData.itemIndex;
      const clickedCat = obj.userData.category;

      if (currentMode === 'lineup') {
        selectItemFromLineup(clickedCat, clickedIndex);
      } else if (currentMode === 'carousel') {
        if (clickedIndex === currentIndex) {
          currentStep = 0;
          setMode('detail');
        } else {
          currentIndex = clickedIndex;
          updatePositions(0.48);
        }
      }
    }
  }
}, { passive: true });

// Bucle único sincronizado de alta frecuencia (120 FPS+)
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Animación de levitación en Boletos
  for (let i = 0; i < ticketModels.length; i++) {
    const item = ticketModels[i];
    const fw = item.userData.floatWrapper;
    if (fw) {
      fw.position.y = Math.sin(t * 2.2 + i) * 0.032;
      if (currentMode === 'detail' && activeCategory === 'tickets' && i === currentIndex && currentStep === 1) {
        fw.rotation.z = Math.sin(t * 2.4) * 0.022;
      } else {
        fw.rotation.z = 0;
      }
    }
  }

  // Animación atractiva de levitación y giro suave en los 6 Combos 3D
  for (let j = 0; j < comboModels.length; j++) {
    const item = comboModels[j];
    const fw = item.userData.floatWrapper;
    if (fw) {
      fw.position.y = Math.sin(t * 2.3 + j * 1.1) * 0.038;
      if (currentMode === 'detail' && activeCategory === 'combos' && j === currentIndex) {
        fw.rotation.y = Math.sin(t * 1.5) * 0.14;
      } else if (currentMode === 'carousel' && activeCategory === 'combos' && j === currentIndex) {
        fw.rotation.y = Math.sin(t * 1.4) * 0.10;
      } else {
        fw.rotation.y = Math.sin(t * 1.2 + j) * 0.05;
      }
    }
  }

  // Interpolación suave del scroll vertical en 3. COLECCIÓN
  if (currentMode === 'lineup') {
    collectionScrollY += (collectionTargetScrollY - collectionScrollY) * 0.16;
    camera.position.y = cameraBaseY - collectionScrollY;
    cameraTarget.set(0, 0.05 - collectionScrollY, 1.5);
  } else {
    camera.position.y = cameraBaseY;
    cameraTarget.set(0, 0.05, 1.5);
  }

  camera.lookAt(cameraTarget);

  if (currentMode === 'lineup') {
    updateLineupLabelsScreenPositions();
  }

  renderer.render(scene, camera);
}

function handleResize() {
  applyViewportDimensions();
  const w = Math.max(cachedVpWidth, 1);
  const h = Math.max(cachedVpHeight, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  updatePositions(0.25);
}

window.addEventListener('resize', handleResize, { passive: true });
window.addEventListener('load', handleResize, { passive: true });
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => handleResize()).observe(container);
}

syncCarouselCategoryButtonUI();
updatePositions(0);
animate();
</script>
